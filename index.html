<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>おみくじルーレット・パズル</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #140d18;
      font-family: 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #game-container {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: 480px;
      max-height: 850px;
      background: #1c1322;
      box-shadow: 0 0 35px rgba(255, 105, 180, 0.22);
      overflow: hidden;
      cursor: default;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="gameCanvas"></canvas>
  </div>

  <script>
    // --- Web Audio API Synthesizer (No external sound files) ---
    const Sound = {
      ctx: null,
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) this.ctx = new AudioContext();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      },
      // Piece tap / select
      playSelect() {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, now); // D5
        osc.frequency.exponentialRampToValueAtTime(880, now + 0.06);
        gain.gain.setValueAtTime(0.08, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.09);
      },
      // Match clear pop (pitch scales with combo count)
      playClear(combo = 1) {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const baseFreqs = [440, 523.25, 659.25, 783.99, 880, 1046.5];
        const freq = baseFreqs[Math.min(combo - 1, baseFreqs.length - 1)];

        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, now);
        osc.frequency.exponentialRampToValueAtTime(freq * 1.25, now + 0.12);
        gain.gain.setValueAtTime(0.12, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.15);
      },
      // Roulette drumroll tick
      playTick() {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(987.77, now);
        gain.gain.setValueAtTime(0.05, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.05);
      },
      // Suzu Bell & Blessing Chime (for Daikichi / Omikuji win)
      playBell() {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const bellNotes = [1046.5, 1318.51, 1567.98, 2093.0];
        bellNotes.forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now + idx * 0.04);
          gain.gain.setValueAtTime(0.12, now + idx * 0.04);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.6 + idx * 0.05);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now + idx * 0.04);
          osc.stop(now + 0.7);
        });
      },
      // Salt purification whoosh / evil block purge
      playPurify() {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(350, now);
        osc.frequency.exponentialRampToValueAtTime(1200, now + 0.22);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.26);
      },
      // Kyo ominous rumble
      playKyo() {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(200, now);
        osc.frequency.linearRampToValueAtTime(80, now + 0.4);
        gain.gain.setValueAtTime(0.18, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.46);
      }
    };

    // --- Canvas & Responsive Settings ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('game-container');

    let width = 0;
    let height = 0;
    let scale = 1;

    // States: TITLE, PLAY, ROULETTE, RESULT
    const STATE = { TITLE: 0, PLAY: 1, ROULETTE: 2, RESULT: 3 };
    let currentState = STATE.TITLE;

    // Character Image Setup
    const mikoImg = new Image();
    let isMikoLoaded = false;
    mikoImg.src = 'miko.png';
    mikoImg.onload = () => { isMikoLoaded = true; };
    mikoImg.onerror = () => { isMikoLoaded = false; };

    // Core Game Config & Grid Constants
    const COLS = 6;
    const ROWS = 6;
    let board = [];
    let boardX = 0;
    let boardY = 0;
    let tileSize = 0;

    // Piece Types
    // 0: 赤 (お札), 1: 青 (勾玉), 2: 黄 (鈴), 3: 緑 (絵馬), 4: 紫 (破魔矢), -1: 厄石 (岩ブロック)
    const PIECE_TYPES = [
      { id: 0, name: 'お札', color: '#ff4d6d', bg: '#ffe5ec', kanji: '祓' },
      { id: 1, name: '勾玉', color: '#3a86ff', bg: '#e0fbfc', kanji: '勾' },
      { id: 2, name: '金鈴', color: '#ffb703', bg: '#fefae0', kanji: '鈴' },
      { id: 3, name: '絵馬', color: '#2a9d8f', bg: '#e8f5e9', kanji: '馬' },
      { id: 4, name: '破魔矢', color: '#9d4edd', bg: '#f3e8ff', kanji: '矢' }
    ];

    // Stats
    let score = 0;
    let timeLeft = 60;
    let timerInterval = 0;
    let virtueGauge = 0; // 0 to 100 (徳ゲージ)
    const MAX_VIRTUE = 100;
    let comboChain = 0;
    let feverTimer = 0; // Fever seconds remaining (score multiplier x3)
    let omikujiHistory = []; // Recorded fortune results

    // Selection & Cascading State
    let selectedTile = null; // { r, c }
    let isProcessing = false;

    // Visuals & Effects
    let particles = [];
    let popups = [];
    let screenShake = 0;
    let screenFlash = 0;

    // Miko Animation Controller
    let mikoAnim = {
      jumpY: 0,
      jumpVy: 0,
      shakeAngle: 0,
      saltPurifying: false,
      saltTimer: 0,
      bellWaves: []
    };

    // Omikuji Roulette Controller
    const FORTUNES = [
      { name: '大吉', color: '#e63946', weight: 22, desc: '同色全消去 ＆ 黄金フィーバー！' },
      { name: '中吉', color: '#fb8500', weight: 28, desc: '十字結界レーザー一閃！' },
      { name: '小吉', color: '#06d6a0', weight: 25, desc: '徳高まる ＋ ボーナス2000点！' },
      { name: '末吉', color: '#4cc9f0', weight: 15, desc: '神風の祈祷 ＋ 残り時間延長！' },
      { name: '凶',   color: '#7209b7', weight: 10, desc: '厄岩出現！巫女をタップでお清め！' }
    ];
    let roulette = {
      active: false,
      angle: 0,
      speed: 0,
      targetIndex: 0,
      stopping: false,
      timer: 0,
      result: null
    };

    // --- Responsive Canvas Resizing ---
    function resizeCanvas() {
      const rect = container.getBoundingClientRect();
      width = rect.width;
      height = rect.height;
      const dpr = window.devicePixelRatio || 1;
      canvas.width = width * dpr;
      canvas.height = height * dpr;
      ctx.scale(dpr, dpr);
      scale = width / 440;

      // Calculate Grid Layout
      const padding = 16;
      tileSize = Math.floor((width - padding * 2) / COLS);
      boardX = (width - tileSize * COLS) / 2;
      boardY = height - tileSize * ROWS - 24;
    }
    window.addEventListener('resize', resizeCanvas);
    window.addEventListener('load', () => {
      resizeCanvas();
      initBoard();
      requestAnimationFrame(gameLoop);
    });

    // --- Board & Match Algorithms ---
    function initBoard() {
      board = [];
      for (let r = 0; r < ROWS; r++) {
        board[r] = [];
        for (let c = 0; c < COLS; c++) {
          let type;
          // Avoid 3-matches on initial spawn
          do {
            type = Math.floor(Math.random() * PIECE_TYPES.length);
          } while (
            (c >= 2 && board[r][c - 1]?.type === type && board[r][c - 2]?.type === type) ||
            (r >= 2 && board[r - 1][c]?.type === type && board[r - 2][c]?.type === type)
          );
          board[r][c] = {
            type,
            animY: 0,
            scale: 1,
            fade: 1,
            isRemoving: false
          };
        }
      }
    }

    // Check Matches across board
    function findMatches() {
      const matched = Array.from({ length: ROWS }, () => Array(COLS).fill(false));
      let hasMatch = false;

      // Horizontal check
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS - 2; c++) {
          const t = board[r][c]?.type;
          if (t !== undefined && t >= 0 && t === board[r][c + 1]?.type && t === board[r][c + 2]?.type) {
            matched[r][c] = true;
            matched[r][c + 1] = true;
            matched[r][c + 2] = true;
            hasMatch = true;
          }
        }
      }

      // Vertical check
      for (let c = 0; c < COLS; c++) {
        for (let r = 0; r < ROWS - 2; r++) {
          const t = board[r][c]?.type;
          if (t !== undefined && t >= 0 && t === board[r + 1][c]?.type && t === board[r + 2][c]?.type) {
            matched[r][c] = true;
            matched[r + 1][c] = true;
            matched[r + 2][c] = true;
            hasMatch = true;
          }
        }
      }

      return { hasMatch, matched };
    }

    // Swap Two Tiles
    function swapTiles(r1, c1, r2, c2, callback) {
      const temp = board[r1][c1];
      board[r1][c1] = board[r2][c2];
      board[r2][c2] = temp;
      if (callback) callback();
    }

    // Cascade & Drop Falling Pieces
    function applyGravityAndRefill() {
      let moved = false;
      for (let c = 0; c < COLS; c++) {
        let emptyRow = ROWS - 1;
        for (let r = ROWS - 1; r >= 0; r--) {
          if (board[r][c] !== null) {
            if (emptyRow !== r) {
              board[emptyRow][c] = board[r][c];
              board[emptyRow][c].animY = -(emptyRow - r) * tileSize;
              board[r][c] = null;
              moved = true;
            }
            emptyRow--;
          }
        }
        // Refill empty tops
        for (let r = emptyRow; r >= 0; r--) {
          const type = Math.floor(Math.random() * PIECE_TYPES.length);
          board[r][c] = {
            type,
            animY: -(r + 1.5) * tileSize,
            scale: 1,
            fade: 1,
            isRemoving: false
          };
          moved = true;
        }
      }
      return moved;
    }

    // Process Matches, Cascades & Combos
    function resolveBoardMatches() {
      const { hasMatch, matched } = findMatches();
      if (!hasMatch) {
        isProcessing = false;
        comboChain = 0;
        return;
      }

      comboChain++;
      Sound.playClear(comboChain);

      // Miko Cheer Animation
      mikoAnim.jumpVy = -5.5;

      let matchCount = 0;
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          if (matched[r][c] && board[r][c]) {
            matchCount++;
            const px = boardX + c * tileSize + tileSize / 2;
            const py = boardY + r * tileSize + tileSize / 2;
            const pieceColor = PIECE_TYPES[board[r][c].type]?.color || '#ffd166';
            addParticles(px, py, pieceColor, 8);
            board[r][c] = null;
          }
        }
      }

      // Score and Virtue Gain
      const feverMult = feverTimer > 0 ? 3 : 1;
      const gainedScore = matchCount * 120 * comboChain * feverMult;
      score += gainedScore;
      addPopup(`+${gainedScore}`, width / 2, boardY - 14, feverMult > 1 ? '#ffd166' : '#a8dadc');

      // Increase Virtue Gauge
      virtueGauge = Math.min(MAX_VIRTUE, virtueGauge + matchCount * 3.8);

      // Check if Virtue Gauge is full -> trigger Omikuji
      if (virtueGauge >= MAX_VIRTUE && !roulette.active) {
        virtueGauge = 0;
        setTimeout(() => { triggerRoulette(); }, 350);
      }

      // Animate Cascade
      setTimeout(() => {
        applyGravityAndRefill();
        setTimeout(() => {
          resolveBoardMatches();
        }, 220);
      }, 160);
    }

    // Start Game Cycle
    function startGame() {
      score = 0;
      timeLeft = 60;
      virtueGauge = 20;
      comboChain = 0;
      feverTimer = 0;
      omikujiHistory = [];
      particles = [];
      popups = [];
      roulette.active = false;
      mikoAnim.saltPurifying = false;
      initBoard();
      currentState = STATE.PLAY;

      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        if (currentState === STATE.PLAY) {
          timeLeft--;
          if (feverTimer > 0) feverTimer--;
          if (timeLeft <= 0) {
            timeLeft = 0;
            clearInterval(timerInterval);
            currentState = STATE.RESULT;
            Sound.playBell();
          }
        }
      }, 1000);
    }

    // --- Omikuji Roulette Logic ---
    function triggerRoulette() {
      if (roulette.active) return;
      roulette.active = true;
      currentState = STATE.ROULETTE;
      roulette.angle = 0;
      roulette.speed = 0.45;
      roulette.stopping = false;
      roulette.timer = 0;
      roulette.result = null;

      // Pick weighted fortune outcome
      const totalWeight = FORTUNES.reduce((sum, f) => sum + f.weight, 0);
      let rand = Math.random() * totalWeight;
      let chosenIdx = 0;
      for (let i = 0; i < FORTUNES.length; i++) {
        if (rand < FORTUNES[i].weight) {
          chosenIdx = i;
          break;
        }
        rand -= FORTUNES[i].weight;
      }
      roulette.targetIndex = chosenIdx;

      // Miko Suzu ringing agitation
      Sound.playBell();
      mikoAnim.shakeAngle = 0.3;
    }

    function applyRouletteEffect(fortune) {
      omikujiHistory.push(fortune.name);

      if (fortune.name === '大吉') {
        // Clear all random color pieces + start golden fever
        Sound.playBell();
        screenFlash = 0.4;
        feverTimer = 15;
        score += 3000;
        addPopup('大吉！黄金フィーバー突入！', width / 2, height * 0.45, '#ffd166');

        // Clear most common piece on board
        const counts = [0, 0, 0, 0, 0];
        for (let r = 0; r < ROWS; r++) {
          for (let c = 0; c < COLS; c++) {
            if (board[r][c]?.type >= 0) counts[board[r][c].type]++;
          }
        }
        const maxType = counts.indexOf(Math.max(...counts));
        for (let r = 0; r < ROWS; r++) {
          for (let c = 0; c < COLS; c++) {
            if (board[r][c]?.type === maxType) {
              const px = boardX + c * tileSize + tileSize / 2;
              const py = boardY + r * tileSize + tileSize / 2;
              addParticles(px, py, '#ffd166', 10);
              board[r][c] = null;
            }
          }
        }
        setTimeout(() => { applyGravityAndRefill(); resolveBoardMatches(); }, 300);

      } else if (fortune.name === '中吉') {
        // Cross Laser Barrier Purge (center row & col)
        Sound.playBell();
        score += 2000;
        addPopup('中吉！十字破邪レーザー！', width / 2, height * 0.45, '#fb8500');
        const midR = Math.floor(ROWS / 2);
        const midC = Math.floor(COLS / 2);
        for (let c = 0; c < COLS; c++) {
          addParticles(boardX + c * tileSize + tileSize / 2, boardY + midR * tileSize + tileSize / 2, '#fb8500', 8);
          board[midR][c] = null;
        }
        for (let r = 0; r < ROWS; r++) {
          addParticles(boardX + midC * tileSize + tileSize / 2, boardY + r * tileSize + tileSize / 2, '#fb8500', 8);
          board[r][midC] = null;
        }
        setTimeout(() => { applyGravityAndRefill(); resolveBoardMatches(); }, 300);

      } else if (fortune.name === '小吉') {
        Sound.playClear(4);
        score += 1500;
        virtueGauge = 40;
        addPopup('小吉！徳ゲージ＋40％！', width / 2, height * 0.45, '#06d6a0');

      } else if (fortune.name === '末吉') {
        Sound.playClear(3);
        timeLeft += 10;
        score += 800;
        addPopup('末吉！制限時間＋10秒！', width / 2, height * 0.45, '#4cc9f0');

      } else if (fortune.name === '凶') {
        // Turn 3 random tiles into Evil Rock obstacles
        Sound.playKyo();
        screenShake = 12;
        addPopup('凶！厄石出現！巫女をタップでお清め！', width / 2, height * 0.45, '#7209b7');
        let count = 0;
        for (let i = 0; i < 20 && count < 3; i++) {
          const rr = Math.floor(Math.random() * ROWS);
          const rc = Math.floor(Math.random() * COLS);
          if (board[rr][rc] && board[rr][rc].type >= 0) {
            board[rr][rc].type = -1; // Rock
            addParticles(boardX + rc * tileSize + tileSize / 2, boardY + rr * tileSize + tileSize / 2, '#4a4e69', 8);
            count++;
          }
        }
      }
    }

    // Miko Purifying Salt Action (Tapping Miko clears rock obstacles with bonus)
    function triggerMikoPurification() {
      let rockCount = 0;
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          if (board[r][c]?.type === -1) {
            rockCount++;
            const px = boardX + c * tileSize + tileSize / 2;
            const py = boardY + r * tileSize + tileSize / 2;
            addParticles(px, py, '#ffffff', 16, 1.4);
            board[r][c] = null;
          }
        }
      }

      if (rockCount > 0) {
        Sound.playPurify();
        mikoAnim.saltPurifying = true;
        mikoAnim.saltTimer = 35;
        mikoAnim.jumpVy = -6;
        const reward = rockCount * 1200;
        score += reward;
        addPopup(`お清めの塩！ 厄落とし +${reward}`, width / 2, height * 0.38, '#ffffff');
        setTimeout(() => { applyGravityAndRefill(); resolveBoardMatches(); }, 300);
      } else {
        // Fun prayer bell chime
        Sound.playBell();
        mikoAnim.jumpVy = -4.5;
        addPopup('神楽鈴の祈り♪', width / 2, height * 0.38, '#ffd166');
      }
    }

    // --- Particle & Popup Helpers ---
    function addParticles(x, y, color, count = 10, speedMult = 1) {
      for (let i = 0; i < count; i++) {
        const ang = Math.random() * Math.PI * 2;
        const spd = (1 + Math.random() * 3.5) * speedMult;
        particles.push({
          x,
          y,
          vx: Math.cos(ang) * spd,
          vy: Math.sin(ang) * spd,
          size: 2.5 + Math.random() * 3.5,
          color,
          life: 1,
          decay: 0.03 + Math.random() * 0.025
        });
      }
    }

    function addPopup(text, x, y, color = '#ffd166') {
      popups.push({
        text,
        x,
        y,
        color,
        vy: -1.3,
        life: 1,
        decay: 0.02
      });
    }

    // --- Input Handling ---
    function handlePointerDown(px, py) {
      Sound.init();

      if (currentState === STATE.TITLE) {
        const btnY = height * 0.76;
        if (Math.abs(px - width / 2) < 110 && Math.abs(py - btnY) < 32) {
          startGame();
        }
        return;
      }

      if (currentState === STATE.RESULT) {
        const btnY = height * 0.78;
        if (Math.abs(px - width / 2) < 110 && Math.abs(py - btnY) < 32) {
          startGame();
        }
        return;
      }

      if (currentState === STATE.ROULETTE) {
        // Can tap anywhere on roulette to stop
        if (!roulette.stopping) {
          roulette.stopping = true;
          roulette.speed = 0.25;
        }
        return;
      }

      // Tap Miko Shrine Avatar to trigger Salt Purification
      const mikoCenter = getMikoPosition();
      if (Math.hypot(px - mikoCenter.x, py - mikoCenter.y) < 55 * scale) {
        triggerMikoPurification();
        return;
      }

      // Playing State: Tap Grid Tiles
      if (currentState === STATE.PLAY && !isProcessing) {
        const col = Math.floor((px - boardX) / tileSize);
        const row = Math.floor((py - boardY) / tileSize);

        if (col >= 0 && col < COLS && row >= 0 && row < ROWS) {
          const clickedPiece = board[row][col];
          if (!clickedPiece || clickedPiece.type === -1) {
            // Tapping an evil rock prompts miko advice
            if (clickedPiece?.type === -1) {
              addPopup('上の巫女をタップしてお清め！', px, py - 16, '#ffd166');
            }
            selectedTile = null;
            return;
          }

          if (!selectedTile) {
            // First select
            selectedTile = { r: row, c: col };
            Sound.playSelect();
          } else {
            // Check if adjacent
            const dr = Math.abs(selectedTile.r - row);
            const dc = Math.abs(selectedTile.c - col);

            if ((dr === 1 && dc === 0) || (dr === 0 && dc === 1)) {
              isProcessing = true;
              const r1 = selectedTile.r, c1 = selectedTile.c;
              const r2 = row, c2 = col;
              selectedTile = null;

              // Swap and verify
              swapTiles(r1, c1, r2, c2, () => {
                const { hasMatch } = findMatches();
                if (hasMatch) {
                  resolveBoardMatches();
                } else {
                  // Revert swap if no match formed
                  Sound.playTick();
                  setTimeout(() => {
                    swapTiles(r1, c1, r2, c2, () => {
                      isProcessing = false;
                    });
                  }, 200);
                }
              });
            } else {
              // Select another tile
              selectedTile = { r: row, c: col };
              Sound.playSelect();
            }
          }
        } else {
          selectedTile = null;
        }
      }
    }

    function getMikoPosition() {
      return {
        x: width * 0.22,
        y: height * 0.17
      };

    // --- Update Loops ---
    function update() {
      if (screenShake > 0) screenShake *= 0.88;
      if (screenShake < 0.2) screenShake = 0;
      if (screenFlash > 0) screenFlash -= 0.035;

      // Miko Jump Dynamics
      mikoAnim.jumpY += mikoAnim.jumpVy;
      mikoAnim.jumpVy += 0.5;
      if (mikoAnim.jumpY >= 0) {
        mikoAnim.jumpY = 0;
        mikoAnim.jumpVy = 0;
      }
      if (mikoAnim.shakeAngle > 0) {
        mikoAnim.shakeAngle -= 0.015;
        if (mikoAnim.shakeAngle < 0) mikoAnim.shakeAngle = 0;
      }
      if (mikoAnim.saltTimer > 0) mikoAnim.saltTimer--;

      // Tile animation smoothing
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const piece = board[r][c];
          if (piece && piece.animY < 0) {
            piece.animY += 12;
            if (piece.animY > 0) piece.animY = 0;
          }
        }
      }

      // Roulette Physics
      if (roulette.active) {
        roulette.angle += roulette.speed;
        if (!roulette.stopping) {
          roulette.timer++;
          if (roulette.timer > 90) {
            roulette.stopping = true;
          }
        } else {
          roulette.speed *= 0.965;
          if (roulette.speed < 0.012) {
            roulette.active = false;
            currentState = STATE.PLAY;
            const chosen = FORTUNES[roulette.targetIndex];
            applyRouletteEffect(chosen);
          }
        }
      }

      // Update Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= p.decay;
        if (p.life <= 0) particles.splice(i, 1);
      }

      // Update Popups
      for (let i = popups.length - 1; i >= 0; i--) {
        const pop = popups[i];
        pop.y += pop.vy;
        pop.life -= pop.decay;
        if (pop.life <= 0) popups.splice(i, 1);
      }
    }

        ctx.arc(0, 0, size * 0.44, 0, Math.PI * 2);

        ctx.beginPath();

        ctx.fill();

        // Scarlet Hakama

        ctx.beginPath();
        ctx.moveTo(-16 * scale, size * 0.1);
        ctx.lineTo(16 * scale, size * 0.1);

        ctx.beginPath();
        ctx.arc(-8 * scale, -size * 0.12, 3.2 * scale, 0, Math.PI * 2);
        ctx.arc(8 * scale, -size * 0.12, 3.2 * scale, 0, Math.PI * 2);
        ctx.fill();

        // Dark Hair & Ribbon
        ctx.fillStyle = '#1c1722';
        ctx.beginPath();
        ctx.arc(0, -size * 0.2, 21 * scale, Math.PI, Math.PI * 2);
        ctx.arc(-15 * scale, -size * 0.1, 8 * scale, 0, Math.PI * 2);
        ctx.arc(15 * scale, -size * 0.1, 8 * scale, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#d90429';
        ctx.fillRect(-12 * scale, -size * 0.42, 24 * scale, 6 * scale);

        ctx.beginPath();
        ctx.arc(-6 * scale, -size * 0.16, 3 * scale, 0, Math.PI * 2);
        ctx.arc(6 * scale, -size * 0.16, 3 * scale, 0, Math.PI * 2);
        ctx.fill();

        // Golden Kagura Bell in hands
        ctx.fillStyle = '#ffd166';
        ctx.beginPath();
        ctx.arc(13 * scale, size * 0.12, 6 * scale, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.restore();

      // Miko Speech Bubble (Tips & Encouragement)

      ctx.beginPath();

    // Draw Puzzle Grid & Japanese Good Luck Pieces
    function drawPuzzleBoard() {
      ctx.save();

      // Board Background Table
      ctx.fillStyle = 'rgba(28, 19, 35, 0.9)';
      ctx.beginPath();
      ctx.roundRect(boardX - 6, boardY - 6, tileSize * COLS + 12, tileSize * ROWS + 12, 12);
      ctx.fill();

      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const x = boardX + c * tileSize;
          const y = boardY + r * tileSize;

          // Grid Cell background tile
          ctx.fillStyle = (r + c) % 2 === 0 ? 'rgba(44, 30, 54, 0.65)' : 'rgba(38, 26, 48, 0.65)';
          ctx.fillRect(x + 2, y + 2, tileSize - 4, tileSize - 4);

          const piece = board[r][c];
          if (!piece) continue;

          const py = y + (piece.animY || 0);
          const isSelected = selectedTile && selectedTile.r === r && selectedTile.c === c;

          ctx.save();
          ctx.translate(x + tileSize / 2, py + tileSize / 2);

          if (isSelected) {
            ctx.scale(1.12, 1.12);
            ctx.strokeStyle = '#ffd166';
            ctx.lineWidth = 3;
            ctx.strokeRect(-tileSize * 0.44, -tileSize * 0.44, tileSize * 0.88, tileSize * 0.88);
          }

          if (piece.type === -1) {
            // Evil Rock Obstacle (厄石)
            ctx.fillStyle = '#495057';
            ctx.beginPath();
            ctx.roundRect(-tileSize * 0.38, -tileSize * 0.38, tileSize * 0.76, tileSize * 0.76, 6);
            ctx.fill();
            ctx.fillStyle = '#ff4d6d';
            ctx.font = `bold ${13 * scale}px sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('厄', 0, 0);
          } else {
            // Auspicious Japanese Piece Icon
            const info = PIECE_TYPES[piece.type];

            // Soft glowing rounded tile
            ctx.fillStyle = info.bg;
            ctx.shadowColor = info.color;
            ctx.shadowBlur = 6;
            ctx.beginPath();
            ctx.roundRect(-tileSize * 0.38, -tileSize * 0.38, tileSize * 0.76, tileSize * 0.76, 10);
            ctx.fill();
            ctx.shadowBlur = 0;

            // Border
            ctx.strokeStyle = info.color;
            ctx.lineWidth = 2;
            ctx.stroke();

            // Distinctive Japanese Element Drawing
            ctx.fillStyle = info.color;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.font = `bold ${16 * scale}px 'Hiragino Mincho ProN', serif`;
            ctx.fillText(info.kanji, 0, 1);
          }

          ctx.restore();
        }
      }

      ctx.restore();
    }

      ctx.fillRect(0, 0, width, height);

      // Rotating Wheel
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(roulette.angle);

      const slice = (Math.PI * 2) / FORTUNES.length;
      FORTUNES.forEach((f, i) => {
        const startAng = i * slice;

        ctx.fillStyle = f.color;

        ctx.moveTo(0, 0);
        ctx.arc(0, 0, radius, startAng, endAng);
        ctx.closePath();
        ctx.fill();

        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2;
        ctx.stroke();

        // Fortune Text on Wheel
        ctx.save();
        ctx.rotate(startAng + slice / 2);
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 18px sans-serif';
        ctx.textAlign = 'right';
        ctx.fillText(f.name, radius - 18, 6);
        ctx.restore();
      });

      // Center Hub
      ctx.fillStyle = '#ffd166';
      ctx.beginPath();
      ctx.arc(0, 0, 26 * scale, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#1c1322';
      ctx.font = 'bold 12px sans-serif';
      ctx.fillText('神', 0, 4);

      ctx.restore();

      // Top Needle Indicator
      ctx.fillStyle = '#ffffff';
      ctx.shadowColor = '#000';
      ctx.shadowBlur = 6;
      ctx.beginPath();
      ctx.moveTo(cx, cy - radius - 6);
      ctx.lineTo(cx - 14, cy - radius + 18);
      ctx.lineTo(cx + 14, cy - radius + 18);
      ctx.closePath();
      ctx.fill();

      // Sub-Prompt
      ctx.fillStyle = '#ffffff';
      ctx.font = '13px sans-serif';
      ctx.fillText(roulette.stopping ? '神託が定まるのを待っています...' : '画面をタップして止める！', cx, cy + radius + 40);

      ctx.restore();
    }

    // Draw Particles & Floating Popups

        ctx.globalAlpha = Math.max(0, p.life);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();

      for (const pop of popups) {
        ctx.globalAlpha = Math.max(0, pop.life);
        ctx.font = 'bold 16px "Hiragino Kaku Gothic ProN", sans-serif';
        ctx.textAlign = 'center';
        ctx.fillStyle = pop.color;
        ctx.shadowColor = '#000';
        ctx.shadowBlur = 6;
        ctx.fillText(pop.text, pop.x, pop.y);
      }
      ctx.restore();
    }

    // --- Main Engine Loop ---
    function gameLoop() {
      update();

      ctx.save();
      if (screenShake > 0) {
        const rx = (Math.random() - 0.5) * screenShake;
        const ry = (Math.random() - 0.5) * screenShake;
        ctx.translate(rx, ry);
      }

      ctx.clearRect(0, 0, width, height);

      drawBackground();
      drawHeaderUI();
      drawMikoSection();
      drawPuzzleBoard();
      drawParticles();

      if (screenFlash > 0) {
        ctx.fillStyle = `rgba(255, 215, 0, ${screenFlash})`;
        ctx.fillRect(0, 0, width, height);
      }

      if (currentState === STATE.TITLE) {
        drawTitleScreen();
      } else if (currentState === STATE.ROULETTE) {
        drawOmikujiRoulette();
      } else if (currentState === STATE.RESULT) {
        drawResultScreen();
      }

      ctx.restore();
      requestAnimationFrame(gameLoop);
    }
  </script>
</body>
</html>
