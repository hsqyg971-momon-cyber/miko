<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>境内防衛・お札タワーディフェンス</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0f121d;
      font-family: 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #game-container {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: 500px;
      max-height: 860px;
      background: #19231f;
      box-shadow: 0 0 35px rgba(255, 120, 160, 0.2);
      overflow: hidden;
      cursor: default;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="gameCanvas"></canvas>
  </div>

  <script>
    // --- Web Audio API Sound Synthesizer ---
    const Sound = {
      ctx: null,
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) this.ctx = new AudioContext();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      },
      // Place Ofuda paper "Sa!"
      playPlace() {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(480, now);
        osc.frequency.exponentialRampToValueAtTime(140, now + 0.08);
        gain.gain.setValueAtTime(0.12, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.09);
      },
      // Shoot projectile
      playShoot(type = 0) {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        if (type === 2) {
          // Fire explosion shot
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(260, now);
          osc.frequency.exponentialRampToValueAtTime(80, now + 0.16);
          gain.gain.setValueAtTime(0.14, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
        } else if (type === 1) {
          // Slow pulse
          osc.type = 'sine';
          osc.frequency.setValueAtTime(880, now);
          osc.frequency.exponentialRampToValueAtTime(440, now + 0.18);
          gain.gain.setValueAtTime(0.08, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
        } else {
          // Basic light arrow
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(740, now);
          osc.frequency.exponentialRampToValueAtTime(320, now + 0.1);
          gain.gain.setValueAtTime(0.08, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
        }
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.2);
      },
      // Defeat Yokai
      playDefeat() {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const freqs = [523.25, 659.25, 783.99];
        freqs.forEach((f, i) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(f, now + i * 0.03);
          gain.gain.setValueAtTime(0.09 / (i + 1), now + i * 0.03);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25 + i * 0.04);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now + i * 0.03);
          osc.stop(now + 0.32);
        });
      },
      // Miko Kagura Bell Active Skill
      playBell() {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const bellNotes = [1046.5, 1318.51, 1567.98, 2093.0, 2637.02];
        bellNotes.forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now + idx * 0.035);
          gain.gain.setValueAtTime(0.12, now + idx * 0.035);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.65 + idx * 0.05);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now + idx * 0.035);
          osc.stop(now + 0.75);
        });
      },
      // Barrier hit damage
      playBarrierDamage() {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.linearRampToValueAtTime(60, now + 0.24);
        gain.gain.setValueAtTime(0.24, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.26);
      }
    };

    // --- Canvas & Responsive Configuration ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('game-container');

    let width = 0;
    let height = 0;
    let scale = 1;

    // Game States
    const STATE = { TITLE: 0, PLAYING: 1, GAMEOVER: 2, CLEAR: 3 };
    let currentState = STATE.TITLE;

    // Character Image
    const mikoImg = new Image();
    let isMikoLoaded = false;
    mikoImg.src = 'miko.png';
    mikoImg.onload = () => { isMikoLoaded = true; };
    mikoImg.onerror = () => { isMikoLoaded = false; };

    // Core Game Data
    const MAX_LIFE = 10;
    let life = MAX_LIFE;
    let faithPoints = 140;
    let wave = 1;
    const MAX_WAVE = 7;
    let waveSpawning = false;
    let spawnQueue = [];
    let spawnTimer = 0;
    let totalKills = 0;
    let gameTimer = 0;

    // Miko Active Skill: Kagura Suzu
    const SKILL_COST = 60;
    let skillCooldown = 0;
    const SKILL_MAX_COOLDOWN = 180; // frames (~3s)

    // Visual feedback
    let screenShake = 0;
    let screenFlash = 0;

    // Shrine Path Points (Normalized Coordinates 0.0 - 1.0)
    const normalizedWaypoints = [
      { x: 0.16, y: 0.12 }, // Torii Entrance (Top Left)
      { x: 0.82, y: 0.12 },
      { x: 0.82, y: 0.36 },
      { x: 0.18, y: 0.36 },
      { x: 0.18, y: 0.62 },
      { x: 0.80, y: 0.62 },
      { x: 0.80, y: 0.82 },
      { x: 0.50, y: 0.82 }  // Shrine Sanctuary Front (Miko)
    ];

    let waypoints = [];

    // Tower Types Configuration
    const TOWER_TYPES = [
      {
        id: 0,
        name: '破邪のお札',
        subName: '破邪',
        cost: 45,
        range: 105,
        fireRate: 36, // frames per shot
        damage: 18,
        color: '#4cc9f0',
        accent: '#ffffff',
        desc: '単体に光弾を射出'
      },
      {
        id: 1,
        name: '減速のお札',
        subName: '減速',
        cost: 60,
        range: 90,
        fireRate: 50,
        damage: 6,
        slowRatio: 0.5,
        slowDuration: 75,
        color: '#b5179e',
        accent: '#f72585',
        desc: '周囲の敵を遅延'
      },
      {
        id: 2,
        name: '御神火のお札',
        subName: '神火',
        cost: 95,
        range: 125,
        fireRate: 70,
        damage: 42,
        splashRadius: 55,
        color: '#ff5400',
        accent: '#ffb703',
        desc: '爆発し範囲攻撃'
      }
    ];

    // Selected tower for building / selected tower on board
    let selectedBuildIndex = 0; // default to Basic
    let selectedTower = null; // clicked board tower

    // Entities
    let towers = [];
    let enemies = [];
    let projectiles = [];
    let particles = [];
    let popups = [];

    // Miko animation
    let mikoAnim = {
      jumpY: 0,
      jumpVy: 0,
      bellEffectTimer: 0,
      waveRings: []
    };

    // Resize Handler
    function resizeCanvas() {
      const rect = container.getBoundingClientRect();
      width = rect.width;
      height = rect.height;
      const dpr = window.devicePixelRatio || 1;
      canvas.width = width * dpr;
      canvas.height = height * dpr;
      ctx.scale(dpr, dpr);
      scale = width / 450;

      // Recalculate actual pixel waypoints
      waypoints = normalizedWaypoints.map(p => ({
        x: p.x * width,
        y: p.y * height
      }));
    }
    window.addEventListener('resize', resizeCanvas);
    window.addEventListener('load', () => {
      resizeCanvas();
      requestAnimationFrame(gameLoop);
    });

    // Distance helper
    function dist(x1, y1, x2, y2) {
      return Math.hypot(x2 - x1, y2 - y1);
    }

    // Distance to path to avoid placing towers right on the road
    function distPointToSegment(px, py, x1, y1, x2, y2) {
      const l2 = (x2 - x1) ** 2 + (y2 - y1) ** 2;
      if (l2 === 0) return dist(px, py, x1, y1);
      let t = ((px - x1) * (x2 - x1) + (py - y1) * (y2 - y1)) / l2;
      t = Math.max(0, Math.min(1, t));
      return dist(px, py, x1 + t * (x2 - x1), y1 + t * (y2 - y1));
    }

    function isPointNearPath(x, y, threshold) {
      for (let i = 0; i < waypoints.length - 1; i++) {
        const d = distPointToSegment(x, y, waypoints[i].x, waypoints[i].y, waypoints[i + 1].x, waypoints[i + 1].y);
        if (d < threshold) return true;
      }
      return false;
    }

    // --- Game Cycle & Waves ---
    function startGame() {
      life = MAX_LIFE;
      faithPoints = 135;
      wave = 1;
      totalKills = 0;
      towers = [];
      enemies = [];
      projectiles = [];
      particles = [];
      popups = [];
      selectedTower = null;
      skillCooldown = 0;
      mikoAnim.jumpY = 0;
      mikoAnim.jumpVy = 0;
      mikoAnim.waveRings = [];

      startWave(wave);
      currentState = STATE.PLAYING;
    }

    function startWave(waveNum) {
      waveSpawning = true;
      spawnQueue = [];
      spawnTimer = 0;

      // Wave Enemy Compostion
      // Type 0: 小鬼 (Fast, squishy)
      // Type 1: からかさ (Normal)
      // Type 2: 大入道 (Tanky boss)
      const count = 7 + waveNum * 4;
      for (let i = 0; i < count; i++) {
        let type = 0;
        const r = Math.random();
        if (waveNum >= 4 && (i === count - 1 || (waveNum >= 6 && i === Math.floor(count / 2)))) {
          type = 2; // 大入道
        } else if (waveNum >= 2 && r > 0.45) {
          type = 1; // からかさ小僧
        } else {
          type = 0; // 小鬼
        }
        spawnQueue.push(type);
      }
    }

    function spawnEnemy(type) {
      let hp = 45;
      let spd = 1.35;
      let radius = 14 * scale;
      let reward = 12;
      let name = '小鬼';

      if (type === 1) {
        // からかさ小僧
        hp = 110 + wave * 22;
        spd = 0.95;
        radius = 16 * scale;
        reward = 18;
        name = 'からかさ';
      } else if (type === 2) {
        // 大入道
        hp = 360 + wave * 90;
        spd = 0.52;
        radius = 24 * scale;
        reward = 48;
        name = '大入道';
      } else {
        // 小鬼
        hp = 50 + wave * 14;
        spd = 1.4 + Math.random() * 0.2;
        radius = 13 * scale;
        reward = 12;
      }

      enemies.push({
        type,
        name,
        x: waypoints[0].x,
        y: waypoints[0].y,
        currentWp: 0,
        distAlongCurrent: 0,
        hp,
        maxHp: hp,
        spd,
        baseSpd: spd,
        slowTimer: 0,
        radius,
        reward,
        wobble: Math.random() * 10
      });
    }

    function addPopup(text, x, y, color = '#ffd166') {
      popups.push({
        text,
        x,
        y,
        color,
        vy: -1.2,
        life: 1,
        decay: 0.025
      });
    }

    function addParticles(x, y, color, count = 10, speedMult = 1) {
      for (let i = 0; i < count; i++) {
        const ang = Math.random() * Math.PI * 2;
        const spd = (1 + Math.random() * 3) * speedMult;
        particles.push({
          x,
          y,
          vx: Math.cos(ang) * spd,
          vy: Math.sin(ang) * spd,
          size: 2.5 + Math.random() * 3.5,
          color,
          life: 1,
          decay: 0.03 + Math.random() * 0.03
        });
      }
    }

    // Miko Shrine Touch Action Skill: 神楽鈴の浄化
    function triggerMikoSkill() {
      if (faithPoints < SKILL_COST) {
        addPopup('信仰不足！', width * 0.5, height * 0.74, '#ff4d6d');
        Sound.playBarrierDamage();
        return;
      }
      if (skillCooldown > 0) return;

      faithPoints -= SKILL_COST;
      skillCooldown = SKILL_MAX_COOLDOWN;
      Sound.playBell();

      // Miko bounce animation
      mikoAnim.jumpVy = -6.5;
      mikoAnim.bellEffectTimer = 35;

      const mikoPos = getMikoPosition();
      mikoAnim.waveRings.push({
        x: mikoPos.x,
        y: mikoPos.y,
        radius: 10,
        maxRadius: Math.max(width, height) * 0.9,
        life: 1
      });

      // Hit & slow all active yokai
      let hitCount = 0;
      enemies.forEach(e => {
        e.hp -= 22;
        e.slowTimer = 130; // ~2.2s stun/slow
        addParticles(e.x, e.y, '#ffd166', 8);
        hitCount++;
      });

      screenFlash = 0.28;
      addPopup('神楽鈴の祈祷発動！', width * 0.5, height * 0.68, '#ffd166');
    }

    // --- Inputs Handling (Mouse & Touch) ---
    function handlePointerDown(px, py) {
      Sound.init();

      if (currentState === STATE.TITLE) {
        const btnY = height * 0.74;
        if (Math.abs(px - width / 2) < 110 && Math.abs(py - btnY) < 32) {
          startGame();
        }
        return;
      }

      if (currentState === STATE.GAMEOVER || currentState === STATE.CLEAR) {
        const btnY = height * 0.76;
        if (Math.abs(px - width / 2) < 110 && Math.abs(py - btnY) < 32) {
          startGame();
        }
        return;
      }

      // --- Playing State Taps ---
      // 1. Check if clicked Miko Guardian avatar
      const mikoPos = getMikoPosition();
      if (dist(px, py, mikoPos.x, mikoPos.y - 25 * scale) < 48 * scale) {
        triggerMikoSkill();
        return;
      }

      // 2. Check if clicked bottom HUD Tower Selector Buttons
      const hudY = height - 76;
      if (py > hudY) {
        const btnW = (width - 32) / 3;
        for (let i = 0; i < 3; i++) {
          const bx = 16 + i * btnW;
          if (px >= bx && px <= bx + btnW - 8 && py >= hudY + 4 && py <= hudY + 68) {
            selectedBuildIndex = i;
            selectedTower = null; // deselect active tower
            Sound.playPlace();
            return;
          }
        }
        return;
      }

      // 3. Check if clicked existing tower sub-menu buttons (Upgrade / Sell)
      if (selectedTower) {
        const menuY = selectedTower.y - 54 * scale;
        // Upgrade button
        if (dist(px, py, selectedTower.x - 36 * scale, menuY) < 22 * scale) {
          upgradeTower(selectedTower);
          return;
        }
        // Sell button
        if (dist(px, py, selectedTower.x + 36 * scale, menuY) < 22 * scale) {
          sellTower(selectedTower);
          return;
        }
        // Close menu if clicked outside
        if (dist(px, py, selectedTower.x, selectedTower.y) > 42 * scale) {
          selectedTower = null;
        }
      }

      // 4. Check if tapped an existing placed tower to select it
      for (const t of towers) {
        if (dist(px, py, t.x, t.y) < t.radius + 10) {
          selectedTower = t;
          Sound.playPlace();
          return;
        }
      }

      // 5. Try placing new tower on valid ground
      // Bounds check: must be inside playable map and not on HUD or top bar
      if (py > 70 && py < height - 90) {
        const pathSafeDistance = 34 * scale;
        if (isPointNearPath(px, py, pathSafeDistance)) {
          addPopup('参道の上には置けません', px, py - 10, '#ff758f');
          return;
        }

        // Cannot place too close to Miko / Sanctuary
        if (dist(px, py, mikoPos.x, mikoPos.y) < 55 * scale) {
          addPopup('本殿前は神域です', px, py - 10, '#ff758f');
          return;
        }

        // Cannot place overlapping another tower
        for (const t of towers) {
          if (dist(px, py, t.x, t.y) < 36 * scale) {
            addPopup('間隔が狭すぎます', px, py - 10, '#ff758f');
            return;
          }
        }

        // Place new tower
        const cfg = TOWER_TYPES[selectedBuildIndex];
        if (faithPoints >= cfg.cost) {
          faithPoints -= cfg.cost;
          towers.push({
            type: cfg.id,
            name: cfg.name,
            subName: cfg.subName,
            x: px,
            y: py,
            level: 1,
            range: cfg.range * scale,
            fireRate: cfg.fireRate,
            cooldown: 0,
            damage: cfg.damage,
            radius: 17 * scale,
            totalInvested: cfg.cost
          });
          Sound.playPlace();
          addParticles(px, py, cfg.color, 12);
          addPopup(`-${cfg.cost} 信仰`, px, py - 18, '#70d6ff');
        } else {
          addPopup('信仰ポイントが足りません！', px, py - 10, '#ff4d6d');
        }
      }
    }

    function upgradeTower(t) {
      const upgradeCost = Math.floor(t.totalInvested * 0.75);
      if (t.level >= 3) {
        addPopup('最大強化済み！', t.x, t.y - 50, '#ffd166');
        return;
      }
      if (faithPoints >= upgradeCost) {
        faithPoints -= upgradeCost;
        t.totalInvested += upgradeCost;
        t.level++;
        t.damage = Math.floor(t.damage * 1.6);
        t.range *= 1.15;
        t.fireRate = Math.max(18, Math.floor(t.fireRate * 0.85));
        Sound.playBell();
        addParticles(t.x, t.y, '#ffd166', 15, 1.3);
        addPopup(`昇格 弐之型！ -${upgradeCost}`, t.x, t.y - 20, '#06d6a0');
      } else {
        addPopup(`強化不足 (要${upgradeCost})`, t.x, t.y - 50, '#ff4d6d');
      }
    }

    function sellTower(t) {
      const refund = Math.floor(t.totalInvested * 0.65);
      faithPoints += refund;
      towers = towers.filter(item => item !== t);
      selectedTower = null;
      Sound.playPlace();
      addParticles(t.x, t.y, '#a8dadc', 10);
      addPopup(`撤去 +${refund} 信仰`, t.x, t.y - 18, '#a8dadc');
    }

    // Attach Input Event Listeners
    canvas.addEventListener('mousedown', (e) => {
      const r = canvas.getBoundingClientRect();
      handlePointerDown(e.clientX - r.left, e.clientY - r.top);
    });

    canvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      const r = canvas.getBoundingClientRect();
      const t = e.touches[0];
      handlePointerDown(t.clientX - r.left, t.clientY - r.top);
    }, { passive: false });

    // Miko Sanctum Position
    function getMikoPosition() {
      return {
        x: waypoints[waypoints.length - 1].x,
        y: waypoints[waypoints.length - 1].y + 18 * scale
      };
    }

    // --- Main Update Loop ---
    function update() {
      gameTimer++;

      if (screenShake > 0) screenShake *= 0.86;
      if (screenShake < 0.2) screenShake = 0;
      if (screenFlash > 0) screenFlash -= 0.04;
      if (skillCooldown > 0) skillCooldown--;

      // Miko bounce
      mikoAnim.jumpY += mikoAnim.jumpVy;
      mikoAnim.jumpVy += 0.55;
      if (mikoAnim.jumpY >= 0) {
        mikoAnim.jumpY = 0;
        mikoAnim.jumpVy = 0;
      }
      if (mikoAnim.bellEffectTimer > 0) mikoAnim.bellEffectTimer--;

      // Miko sound wave rings
      for (let i = mikoAnim.waveRings.length - 1; i >= 0; i--) {
        const ring = mikoAnim.waveRings[i];
        ring.radius += 8;
        ring.life -= 0.025;
        if (ring.life <= 0 || ring.radius > ring.maxRadius) {
          mikoAnim.waveRings.splice(i, 1);
        }
      }

      if (currentState !== STATE.PLAYING) return;

      // Natural Faith Point Regen
      if (gameTimer % 45 === 0) {
        faithPoints += 1;
      }

      // Wave Spawning Controller
      if (waveSpawning) {
        spawnTimer++;
        if (spawnTimer >= 48) {
          spawnTimer = 0;
          if (spawnQueue.length > 0) {
            const nextType = spawnQueue.shift();
            spawnEnemy(nextType);
          } else {
            waveSpawning = false;
          }
        }
      } else {
        // If all enemies defeated in current wave
        if (enemies.length === 0) {
          if (wave < MAX_WAVE) {
            wave++;
            faithPoints += 45 + wave * 10;
            addPopup(`WAVE ${wave} 到来！ (+信仰ボーナス)`, width / 2, height * 0.35, '#ffd166');
            Sound.playBell();
            startWave(wave);
          } else {
            // Cleared all waves!
            currentState = STATE.CLEAR;
          }
        }
      }

      // Update Enemies
      for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];

        // Status effects
        let actualSpd = e.baseSpd;
        if (e.slowTimer > 0) {
          e.slowTimer--;
          actualSpd *= 0.45;
        }

        const targetWp = waypoints[e.currentWp + 1];
        if (targetWp) {
          const dx = targetWp.x - e.x;
          const dy = targetWp.y - e.y;
          const distance = Math.hypot(dx, dy);

          if (distance <= actualSpd) {
            e.x = targetWp.x;
            e.y = targetWp.y;
            e.currentWp++;

            // Reached Sanctuary (Goal)
            if (e.currentWp >= waypoints.length - 1) {
              enemies.splice(i, 1);
              life--;
              screenShake = 16;
              screenFlash = 0.4;
              Sound.playBarrierDamage();
              addPopup('本殿結界が被弾！ -1', width * 0.5, height * 0.72, '#ff4d6d');

              if (life <= 0) {
                life = 0;
                currentState = STATE.GAMEOVER;
              }
              continue;
            }
          } else {
            e.x += (dx / distance) * actualSpd;
            e.y += (dy / distance) * actualSpd;
          }
        }

        // Check Death
        if (e.hp <= 0) {
          totalKills++;
          faithPoints += e.reward;
          Sound.playDefeat();
          addParticles(e.x, e.y, '#ffd166', 14);
          addPopup(`+${e.reward}`, e.x, e.y - 12, '#ffd166');
          enemies.splice(i, 1);
        }
      }

      // Update Towers (Targeting & Attack)
      for (const t of towers) {
        if (t.cooldown > 0) t.cooldown--;

        if (t.cooldown <= 0 && enemies.length > 0) {
          // Find first enemy within range (priority to closest to shrine)
          let target = null;
          let maxProgress = -1;

          for (const e of enemies) {
            const d = dist(t.x, t.y, e.x, e.y);
            if (d <= t.range) {
              const progress = e.currentWp * 1000 + dist(waypoints[0].x, waypoints[0].y, e.x, e.y);
              if (progress > maxProgress) {
                maxProgress = progress;
                target = e;
              }
            }
          }

          if (target) {
            t.cooldown = t.fireRate;
            Sound.playShoot(t.type);

            if (t.type === 1) {
              // Slow AoE pulse right from tower
              addParticles(t.x, t.y, '#f72585', 12);
              enemies.forEach(e => {
                if (dist(t.x, t.y, e.x, e.y) <= t.range) {
                  e.hp -= t.damage;
                  e.slowTimer = 85;
                  addParticles(e.x, e.y, '#b5179e', 4);
                }
              });
            } else {
              // Projectile shot
              projectiles.push({
                x: t.x,
                y: t.y,
                target,
                damage: t.damage,
                speed: 7.5,
                type: t.type,
                splashRadius: t.type === 2 ? 60 * scale : 0
              });
            }
          }
        }
      }

      // Update Projectiles
      for (let i = projectiles.length - 1; i >= 0; i--) {
        const p = projectiles[i];
        const target = p.target;

        // If target disappeared, projectile travels straight
        const tx = target && target.hp > 0 ? target.x : p.x;
        const ty = target && target.hp > 0 ? target.y : p.y - 20;

        const dx = tx - p.x;
        const dy = ty - p.y;
        const d = Math.hypot(dx, dy);

        if (d < p.speed + 8) {
          // Hit!
          if (p.type === 2) {
            // Explosion
            Sound.playShoot(2);
            addParticles(p.x, p.y, '#ff5400', 20, 1.5);
            enemies.forEach(e => {
              if (dist(p.x, p.y, e.x, e.y) <= p.splashRadius) {
                e.hp -= p.damage;
                addParticles(e.x, e.y, '#ffb703', 4);
              }
            });
          } else {
            // Direct single hit
            if (target && target.hp > 0) {
              target.hp -= p.damage;
              addParticles(target.x, target.y, '#4cc9f0', 8);
            }
          }
          projectiles.splice(i, 1);
        } else {
          p.x += (dx / d) * p.speed;
          p.y += (dy / d) * p.speed;
        }
      }

      // Update Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const part = particles[i];
        part.x += part.vx;
        part.y += part.vy;
        part.life -= part.decay;
        if (part.life <= 0) particles.splice(i, 1);
      }

      // Update Popups
      for (let i = popups.length - 1; i >= 0; i--) {
        const pop = popups[i];
        pop.y += pop.vy;
        pop.life -= pop.decay;
        if (pop.life <= 0) popups.splice(i, 1);
      }
    }

    // --- Drawing Routines ---

    // Draw Sacred Shrine Ground & Torii / Path
    function drawMap() {
      // Grass & moss base
      const bgGrad = ctx.createLinearGradient(0, 0, 0, height);
      bgGrad.addColorStop(0, '#12231e');
      bgGrad.addColorStop(1, '#0e1815');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, width, height);

      // Gravel & Cobblestone Winding Approach (参道)
      ctx.save();
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      // Path outer gravel border
      ctx.strokeStyle = '#38473c';
      ctx.lineWidth = 42 * scale;
      ctx.beginPath();
      waypoints.forEach((p, idx) => {
        if (idx === 0) ctx.moveTo(p.x, p.y);
        else ctx.lineTo(p.x, p.y);
      });
      ctx.stroke();

      // Path inner stone pavement
      ctx.strokeStyle = '#d8c7a6';
      ctx.lineWidth = 32 * scale;
      ctx.beginPath();
      waypoints.forEach((p, idx) => {
        if (idx === 0) ctx.moveTo(p.x, p.y);
        else ctx.lineTo(p.x, p.y);
      });
      ctx.stroke();

      // Stone flagstone seams pattern
      ctx.strokeStyle = 'rgba(120, 105, 85, 0.45)';
      ctx.lineWidth = 2;
      ctx.setLineDash([8, 14]);
      ctx.stroke();
      ctx.setLineDash([]);

      // Entrance Torii Gate (Top Left)
      const torii = waypoints[0];
      ctx.fillStyle = '#b7094c';
      ctx.shadowColor = 'rgba(0,0,0,0.5)';
      ctx.shadowBlur = 6;
      ctx.fillRect(torii.x - 24 * scale, torii.y - 18 * scale, 48 * scale, 7 * scale);
      ctx.fillRect(torii.x - 20 * scale, torii.y - 12 * scale, 40 * scale, 5 * scale);
      ctx.fillRect(torii.x - 18 * scale, torii.y - 12 * scale, 6 * scale, 24 * scale);
      ctx.fillRect(torii.x + 12 * scale, torii.y - 12 * scale, 6 * scale, 24 * scale);
      ctx.shadowBlur = 0;

      // Sanctuary Temple Roof (本殿の屋根) behind Miko
      const shrine = waypoints[waypoints.length - 1];
      ctx.fillStyle = '#223028';
      ctx.fillRect(shrine.x - 55 * scale, shrine.y - 28 * scale, 110 * scale, 52 * scale);

      // Ornate Sacred Red Roof
      ctx.fillStyle = '#9d0208';
      ctx.beginPath();
      ctx.moveTo(shrine.x - 65 * scale, shrine.y - 8 * scale);
      ctx.lineTo(shrine.x + 65 * scale, shrine.y - 8 * scale);
      ctx.lineTo(shrine.x + 45 * scale, shrine.y - 34 * scale);
      ctx.lineTo(shrine.x - 45 * scale, shrine.y - 34 * scale);
      ctx.closePath();
      ctx.fill();

      // Gold Roof Ridge (千木・堅魚木)
      ctx.strokeStyle = '#ffb703';
      ctx.lineWidth = 3 * scale;
      ctx.beginPath();
      ctx.moveTo(shrine.x - 42 * scale, shrine.y - 34 * scale);
      ctx.lineTo(shrine.x + 42 * scale, shrine.y - 34 * scale);
      ctx.stroke();

      ctx.restore();
    }

        ctx.beginPath();

        ctx.fill();
        ctx.fillStyle = 'rgba(255, 100, 140, 0.55)';
        ctx.beginPath();
        ctx.arc(-9 * scale, -size * 0.58, 3 * scale, 0, Math.PI * 2);
        ctx.arc(9 * scale, -size * 0.58, 3 * scale, 0, Math.PI * 2);
        ctx.fill();

        // Black Twin Tails
        ctx.fillStyle = '#1c1722';
        ctx.beginPath();
        ctx.arc(0, -size * 0.66, 20 * scale, Math.PI, Math.PI * 2);
        ctx.arc(-14 * scale, -size * 0.58, 7 * scale, 0, Math.PI * 2);
        ctx.arc(14 * scale, -size * 0.58, 7 * scale, 0, Math.PI * 2);
        ctx.fill();

        // Ribbon
        ctx.fillStyle = '#d90429';
        ctx.fillRect(-12 * scale, -size * 0.85, 24 * scale, 6 * scale);

        // Eyes
        ctx.fillStyle = '#3a202c';
        ctx.beginPath();
        ctx.arc(-6 * scale, -size * 0.62, 2.8 * scale, 0, Math.PI * 2);
        ctx.arc(6 * scale, -size * 0.62, 2.8 * scale, 0, Math.PI * 2);
        ctx.fill();

        // Golden Kagura Suzu in hands
        ctx.fillStyle = '#ffd166';
        ctx.beginPath();
        ctx.arc(14 * scale, -size * 0.36, 6 * scale, 0, Math.PI * 2);
        ctx.fill();
      }

      // Tap Skill Label Pill
      ctx.shadowBlur = 0;
      const canSkill = faithPoints >= SKILL_COST && skillCooldown === 0;
      ctx.fillStyle = canSkill ? '#ffd166' : 'rgba(40, 30, 50, 0.8)';
      ctx.strokeStyle = canSkill ? '#ffffff' : '#555';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.roundRect(-42 * scale, 8 * scale, 84 * scale, 20 * scale, 10);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = canSkill ? '#1a1005' : '#aaa';
      ctx.font = `bold ${10 * scale}px sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      const label = canSkill ? `🔔 祈祷(${SKILL_COST})` : (skillCooldown > 0 ? `充填中...` : `要${SKILL_COST}信仰`);
      ctx.fillText(label, 0, 18 * scale);

      ctx.restore();
    }

    // Draw Ofuda Towers
    function drawTowers() {
      ctx.save();
      for (const t of towers) {
        // Selection range circle
        if (selectedTower === t) {
          ctx.strokeStyle = 'rgba(255, 215, 0, 0.45)';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(t.x, t.y, t.range, 0, Math.PI * 2);
          ctx.stroke();

          ctx.fillStyle = 'rgba(255, 215, 0, 0.08)';
          ctx.fill();
        }

        // Stone or wooden pedestal
        ctx.fillStyle = '#343a40';
        ctx.beginPath();
        ctx.arc(t.x, t.y + 4, t.radius * 0.95, 0, Math.PI * 2);
        ctx.fill();

        // Ofuda Talisman Paper
        ctx.save();
        ctx.translate(t.x, t.y);

        // Sacred Floating Ofuda paper
        ctx.fillStyle = '#fffdf0';
        ctx.shadowColor = t.type === 2 ? '#ff5400' : (t.type === 1 ? '#b5179e' : '#4cc9f0');
        ctx.shadowBlur = 8;
        ctx.fillRect(-11 * scale, -18 * scale, 22 * scale, 32 * scale);

        // Top sacred cut angle
        ctx.fillStyle = '#d90429';
        ctx.beginPath();
        ctx.moveTo(-11 * scale, -18 * scale);
        ctx.lineTo(0, -22 * scale);
        ctx.lineTo(11 * scale, -18 * scale);
        ctx.lineTo(11 * scale, -14 * scale);
        ctx.lineTo(-11 * scale, -14 * scale);
        ctx.fill();

        // Red Calligraphy Kanji Rune
        ctx.fillStyle = '#d90429';
        ctx.font = `bold ${11 * scale}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(t.subName, 0, -2 * scale);

        // Level stars
        ctx.fillStyle = '#ffb703';
        ctx.font = `bold ${9 * scale}px sans-serif`;
        let stars = '★'.repeat(t.level);
        ctx.fillText(stars, 0, 8 * scale);

        ctx.restore();

        // Tower Sub-Menu (Upgrade / Sell)
        if (selectedTower === t) {
          drawTowerSubMenu(t);
        }
      }
      ctx.restore();
    }

    // Tower Upgrade / Sell Bubble Menu
    function drawTowerSubMenu(t) {
      ctx.save();
      const menuY = t.y - 52 * scale;
      const upgradeCost = Math.floor(t.totalInvested * 0.75);
      const refund = Math.floor(t.totalInvested * 0.65);

      // Upgrade Button (Left)
      const ux = t.x - 36 * scale;
      const canUpgrade = t.level < 3 && faithPoints >= upgradeCost;
      ctx.fillStyle = canUpgrade ? '#06d6a0' : '#495057';
      ctx.beginPath();
      ctx.arc(ux, menuY, 18 * scale, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.font = `bold ${10 * scale}px sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(t.level >= 3 ? 'MAX' : `強化`, ux, menuY - 4 * scale);
      ctx.font = `9px sans-serif`;
      ctx.fillText(t.level >= 3 ? '' : `${upgradeCost}`, ux, menuY + 6 * scale);

      // Sell Button (Right)
      const sx = t.x + 36 * scale;
      ctx.fillStyle = '#e63946';
      ctx.beginPath();
      ctx.arc(sx, menuY, 18 * scale, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.font = `bold ${10 * scale}px sans-serif`;
      ctx.fillText('撤去', sx, menuY - 4 * scale);
      ctx.font = `9px sans-serif`;
      ctx.fillText(`+${refund}`, sx, menuY + 6 * scale);

      ctx.restore();
    }

    // Draw Japanese Yokai Enemies
    function drawEnemies() {
      ctx.save();
      for (const e of enemies) {
        ctx.save();
        ctx.translate(e.x, e.y);

        // Wobble walk
        const wobble = Math.sin(gameTimer * 0.2 + e.wobble) * 3;

        // Slow effect icy/magic glow
        if (e.slowTimer > 0) {
          ctx.strokeStyle = 'rgba(181, 23, 158, 0.8)';
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.arc(0, 0, e.radius + 4, 0, Math.PI * 2);
          ctx.stroke();
        }

        if (e.type === 0) {
          // 小鬼 (Little Red/Blue Imp)
          ctx.fillStyle = '#e63946';
          ctx.beginPath();
          ctx.arc(0, wobble, e.radius, 0, Math.PI * 2);
          ctx.fill();

          // Horn
          ctx.fillStyle = '#ffd166';
          ctx.beginPath();
          ctx.moveTo(-4 * scale, wobble - e.radius);
          ctx.lineTo(0, wobble - e.radius - 8 * scale);
          ctx.lineTo(4 * scale, wobble - e.radius);
          ctx.fill();

          // Eyes
          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.arc(-4 * scale, wobble - 2, 3 * scale, 0, Math.PI * 2);
          ctx.arc(4 * scale, wobble - 2, 3 * scale, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#000';
          ctx.beginPath();
          ctx.arc(-4 * scale, wobble - 2, 1.5 * scale, 0, Math.PI * 2);
          ctx.arc(4 * scale, wobble - 2, 1.5 * scale, 0, Math.PI * 2);
          ctx.fill();
        } else if (e.type === 1) {
          // からかさ小僧 (One-eyed umbrella)
          ctx.fillStyle = '#9b5de5';
          // Umbrella cone
          ctx.beginPath();
          ctx.moveTo(0, wobble - e.radius - 8 * scale);
          ctx.lineTo(-e.radius * 1.2, wobble + 4);
          ctx.lineTo(e.radius * 1.2, wobble + 4);
          ctx.closePath();
          ctx.fill();

          // Big single eye
          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.arc(0, wobble - 4, 6 * scale, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#ff0054';
          ctx.beginPath();
          ctx.arc(0, wobble - 4, 3 * scale, 0, Math.PI * 2);
          ctx.fill();

          // Long tongue
          ctx.fillStyle = '#ff758f';
          ctx.fillRect(-2 * scale, wobble + 2, 4 * scale, 8 * scale);
        } else {
          // 大入道 (Giant Monkish Boss)
          ctx.fillStyle = '#2b2d42';
          ctx.beginPath();
          ctx.arc(0, wobble, e.radius, 0, Math.PI * 2);
          ctx.fill();

          // Golden sacred beads necklace
          ctx.strokeStyle = '#ffb703';
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.arc(0, wobble + 6, e.radius * 0.7, 0, Math.PI);
          ctx.stroke();

          // Fierce red glowing eyes
          ctx.fillStyle = '#f72585';
          ctx.beginPath();
          ctx.arc(-7 * scale, wobble - 4, 3.5 * scale, 0, Math.PI * 2);
          ctx.arc(7 * scale, wobble - 4, 3.5 * scale, 0, Math.PI * 2);
          ctx.fill();
        }

        // HP Bar
        const barW = e.radius * 2.2;
        const barH = 4 * scale;
        const hpRatio = Math.max(0, e.hp / e.maxHp);
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.fillRect(-barW / 2, -e.radius - 12 * scale, barW, barH);
        ctx.fillStyle = hpRatio > 0.4 ? '#06d6a0' : '#e63946';
        ctx.fillRect(-barW / 2, -e.radius - 12 * scale, barW * hpRatio, barH);

        ctx.restore();
      }
      ctx.restore();
    }

    // Draw Magical Projectiles
    function drawProjectiles() {
      ctx.save();
      for (const p of projectiles) {
        if (p.type === 2) {
          // Fire spirit orb
          const grad = ctx.createRadialGradient(p.x, p.y, 2, p.x, p.y, 8);
          grad.addColorStop(0, '#ffffff');
          grad.addColorStop(0.4, '#ffb703');
          grad.addColorStop(1, '#ff5400');
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.arc(p.x, p.y, 7 * scale, 0, Math.PI * 2);
          ctx.fill();
        } else {
          // Sacred blue light arrow
          ctx.fillStyle = '#ffffff';
          ctx.shadowColor = '#4cc9f0';
          ctx.shadowBlur = 8;
          ctx.beginPath();
          ctx.arc(p.x, p.y, 4.5 * scale, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      ctx.restore();
    }

    // Draw Particles & Floating Popups
    function drawParticles() {
      ctx.save();
      for (const p of particles) {
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      }

      for (const pop of popups) {
        ctx.globalAlpha = Math.max(0, pop.life);
        ctx.font = 'bold 15px "Hiragino Kaku Gothic ProN", sans-serif';
        ctx.textAlign = 'center';
        ctx.fillStyle = pop.color;
        ctx.shadowColor = '#000';
        ctx.shadowBlur = 5;
        ctx.fillText(pop.text, pop.x, pop.y);
      }
      ctx.restore();
    }

    function drawTitleScreen() {
      ctx.save();
      ctx.fillStyle = 'rgba(12, 18, 16, 0.88)';
      ctx.fillRect(0, 0, width, height);

      ctx.textAlign = 'center';
      ctx.shadowColor = 'rgba(255, 183, 3, 0.7)';
      ctx.shadowBlur = 18;

      ctx.fillStyle = '#ffd166';
      ctx.font = 'bold 16px sans-serif';
      ctx.fillText('〜 神聖なる結界と護法の祈り 〜', width / 2, height * 0.22);

      ctx.fillStyle = '#ffffff';
      ctx.font = '900 32px sans-serif';
      ctx.fillText('境内防衛・お札TD', width / 2, height * 0.29);

      ctx.shadowBlur = 0;
      const cardW = Math.min(width - 40, 380);
      const cardX = (width - cardW) / 2;
      const cardY = height * 0.35;
      const cardH = 250;

      ctx.fillStyle = 'rgba(24, 34, 30, 0.94)';
      ctx.strokeStyle = 'rgba(255, 215, 0, 0.3)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.roundRect(cardX, cardY, cardW, cardH, 16);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 16px sans-serif';
      ctx.fillText('【 防衛心得と神事 】', width / 2, cardY + 36);

      ctx.font = '13px sans-serif';
      ctx.fillStyle = '#e2e8f0';
      ctx.fillText('⛩️ 参道を歩く妖怪を、お札タワーで迎撃！', width / 2, cardY + 76);
      ctx.fillText('📜 空き地をタップしてお札を建立・強化', width / 2, cardY + 112);
      ctx.fillText('🔔 本殿の巫女をタップすると全画面浄化祈祷！', width / 2, cardY + 148);
      ctx.fillText('⚠️ 本殿に妖怪が侵入すると結界が破損します', width / 2, cardY + 184);
      ctx.fillText('🌸 全7WAVEを耐え抜いて神域を守護せよ！', width / 2, cardY + 220);

      // Start Button
      const btnY = height * 0.74;
      const btnGrad = ctx.createLinearGradient(width / 2 - 100, 0, width / 2 + 100, 0);
      btnGrad.addColorStop(0, '#d90429');
      btnGrad.addColorStop(1, '#ff758f');

      ctx.shadowColor = 'rgba(217, 4, 41, 0.7)';
      ctx.shadowBlur = 16;
      ctx.fillStyle = btnGrad;
      ctx.beginPath();
      ctx.roundRect(width / 2 - 100, btnY - 26, 200, 52, 26);
      ctx.fill();

      ctx.shadowBlur = 0;
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 19px sans-serif';
      ctx.textBaseline = 'middle';
      ctx.fillText('境内の警備を始める', width / 2, btnY);

      ctx.restore();
    }

    // Game Over & Clear Screens
    function drawResultScreen(isClear) {
      ctx.save();
      ctx.fillStyle = 'rgba(10, 15, 14, 0.92)';
      ctx.fillRect(0, 0, width, height);

      ctx.textAlign = 'center';
      ctx.shadowBlur = 18;

      if (isClear) {
        ctx.shadowColor = 'rgba(255, 215, 0, 0.8)';
        ctx.fillStyle = '#ffd166';
        ctx.font = '900 36px sans-serif';
        ctx.fillText('大団円・神域守護成る！', width / 2, height * 0.24);
      } else {
        ctx.shadowColor = 'rgba(230, 57, 70, 0.8)';
        ctx.fillStyle = '#e63946';
        ctx.font = '900 36px sans-serif';
        ctx.fillText('本殿結界、瓦解...', width / 2, height * 0.24);
      }

      ctx.shadowBlur = 0;
      const cardW = Math.min(width - 40, 360);
      const cardX = (width - cardW) / 2;
      const cardY = height * 0.33;
      const cardH = 240;

      ctx.fillStyle = 'rgba(25, 35, 30, 0.95)';
      ctx.strokeStyle = isClear ? 'rgba(255, 215, 0, 0.4)' : 'rgba(230, 57, 70, 0.4)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.roundRect(cardX, cardY, cardW, cardH, 16);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#a0aec0';
      ctx.font = 'bold 14px sans-serif';
      ctx.fillText('防衛成果', width / 2, cardY + 40);

      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 22px sans-serif';
      ctx.fillText(`最終到達: WAVE ${wave} / ${MAX_WAVE}`, width / 2, cardY + 85);

      ctx.fillStyle = '#06d6a0';
      ctx.font = 'bold 18px sans-serif';
      ctx.fillText(`妖怪退散数: ${totalKills} 体`, width / 2, cardY + 128);

      let title = '修行中の神職';
      if (isClear) title = '神話の守護巫女長 🌸';
      else if (wave >= 5) title = '手練れの破邪祈祷師 ✨';

      ctx.fillStyle = '#ffd166';
      ctx.font = '15px sans-serif';
      ctx.fillText(`称号: ${title}`, width / 2, cardY + 180);

      // Retry Button
      const btnY = height * 0.76;
      const btnGrad = ctx.createLinearGradient(width / 2 - 100, 0, width / 2 + 100, 0);
      btnGrad.addColorStop(0, '#06d6a0');
      btnGrad.addColorStop(1, '#118ab2');

      ctx.shadowColor = 'rgba(6, 214, 160, 0.6)';
      ctx.shadowBlur = 15;
      ctx.fillStyle = btnGrad;
      ctx.beginPath();
      ctx.roundRect(width / 2 - 100, btnY - 26, 200, 52, 26);
      ctx.fill();

      ctx.shadowBlur = 0;
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 19px sans-serif';
      ctx.textBaseline = 'middle';
      ctx.fillText(isClear ? 'もう一度遊ぶ' : '再度防衛に挑む', width / 2, btnY);

      ctx.restore();
    }

    // --- Main Loop ---
    let lastTime = performance.now();
    function gameLoop(timestamp) {
      update();

      ctx.save();
      if (screenShake > 0) {
        const rx = (Math.random() - 0.5) * screenShake;
        const ry = (Math.random() - 0.5) * screenShake;
        ctx.translate(rx, ry);
      }

      ctx.clearRect(0, 0, width, height);

      drawMap();
      drawTowers();
      drawEnemies();
      drawMikoGuardian();
      drawProjectiles();
      drawParticles();

      if (screenFlash > 0) {
        ctx.fillStyle = `rgba(255, 215, 0, ${screenFlash})`;
        ctx.fillRect(0, 0, width, height);
      }

      if (currentState === STATE.PLAYING) {
        drawPlayUI();
      } else if (currentState === STATE.TITLE) {
        drawTitleScreen();
      } else if (currentState === STATE.GAMEOVER) {
        drawResultScreen(false);
      } else if (currentState === STATE.CLEAR) {
        drawResultScreen(true);
      }

      ctx.restore();
      requestAnimationFrame(gameLoop);
    }
  </script>
</body>
</html>
